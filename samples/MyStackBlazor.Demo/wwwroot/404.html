<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MyStackBlazor Demo</title>
    <script>
        // Redirect 404s back to index.html for client-side routing on GitHub Pages
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 2).join('/') +
            '/?p=/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
