name: Deploy Site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore site/MyStackBlazor.Site/MyStackBlazor.Site.csproj

      - name: Publish Blazor WASM
        run: |
          dotnet publish site/MyStackBlazor.Site/MyStackBlazor.Site.csproj \
            -c Release -o publish --nologo
        env:
          CI: true

      - name: Set base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/MyStackBlazor-Site/" />|g' \
            publish/wwwroot/index.html

      - name: Add .nojekyll (prevents GitHub Pages from skipping _framework)
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
